<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Industrial thermal intelligence for India — detection, classification and monitoring of industrial fires and persistent thermal sources." />
    <link rel="icon" type="image/svg+xml" href="/thermaleye.svg" />
    <!-- Fonts are served from this origin so the product looks the same with the network off. -->
    <link rel="preload" href="/fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>ThermalEye — Industrial Thermal Intelligence</title>
    <!-- The boot screen is inline on purpose: it has to paint before the entry bundle is
         parsed, so it cannot depend on a stylesheet, a module or a font. It is removed by
         main.tsx once React has committed its first frame. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f6f2e9;
        z-index: 60;
        transition: opacity 240ms ease-out;
      }
      #boot[data-leaving='true'] { opacity: 0; }
      #boot .boot-mark { position: relative; width: 76px; height: 76px; }
      #boot .boot-ring {
        position: absolute;
        inset: 0;
        animation: boot-spin 1.1s linear infinite;
        filter: drop-shadow(0 0 6px rgba(193, 74, 51, 0.25));
      }
      #boot .boot-label {
        margin-top: 18px;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: #6e6a5e;
        text-align: center;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #boot { background: #191813; }
        #boot .boot-label { color: #a9a294; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div>
        <div class="boot-mark">
          <svg class="boot-ring" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#e5ded0" stroke-width="2" />
            <circle cx="24" cy="24" r="22" fill="none" stroke="#c14a33" stroke-width="2.5"
                    stroke-linecap="round" stroke-dasharray="34 104" />
          </svg>
          <svg viewBox="0 0 32 32" width="42" height="42" aria-hidden="true"
               style="position:absolute;left:17px;top:17px">
            <circle cx="16" cy="16" r="15" fill="#c14a33" />
            <circle cx="16" cy="16" r="9" fill="none" stroke="#f6f2e9" stroke-width="2" />
            <circle cx="16" cy="16" r="3.4" fill="#fca636" />
          </svg>
        </div>
        <p class="boot-label">Starting ThermalEye</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
